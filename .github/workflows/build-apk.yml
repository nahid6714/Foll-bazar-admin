name: Build Fol Bazar Admin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        env:
          ADMIN_API_BASE_URL: https://lakebazar.com/backend/api
          ADMIN_UPDATE_BASE_URL: https://lakebazar.com/admin-app
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.2.${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fol-bazar-admin-release
          path: app/build/outputs/apk/release/*.apk
