name: Build and publish APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check for stale legacy backend references
        shell: bash
        run: |
          if grep -RniE 'CLOUDINARY|SUPABASE' app/src/main --include='*.kt'; then
            echo 'ERROR: stale legacy backend references found in Android Kotlin source.'
            exit 1
          fi
          echo 'Android source backend check passed.'

      - name: Check Kotlin compilation
        run: gradle :app:compileReleaseKotlin --stacktrace
        env:
          ADMIN_API_BASE_URL: https://lakebazar.com/api

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
        env:
          ADMIN_API_BASE_URL: https://lakebazar.com/api

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fol-Bazar-Admin-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
